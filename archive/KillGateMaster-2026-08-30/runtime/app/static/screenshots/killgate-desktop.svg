<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(170 25) rotate(48) scale(820 700)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#44217f"/>
      <stop offset=".55" stop-color="#10101a"/>
      <stop offset="1" stop-color="#090b11"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1a2030"/>
      <stop offset="1" stop-color="#0e121b"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#glow)"/>
  <rect width="1440" height="78" fill="#090b11" fill-opacity=".84" stroke="#252a37"/>
  <path d="M58 63V38c0-18 13-31 31-31s31 13 31 31v25h-14V39c0-11-7-19-17-19s-17 8-17 19v24z" fill="#8b5cf6"/>
  <circle cx="89" cy="47" r="17" fill="#fff"/>
  <text x="137" y="38" fill="#f7f8fb" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">Killgate</text>
  <text x="137" y="59" fill="#9ca6b8" font-family="DejaVu Sans, sans-serif" font-size="10" letter-spacing="2">VENTURE GATE ENGINE</text>

  <g transform="translate(100 127)">
    <text x="0" y="0" fill="#a78bfa" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" letter-spacing="3">CUSTOMER ZERO VALIDATION</text>
    <text x="0" y="63" fill="#f7f8fb" font-family="DejaVu Sans, sans-serif" font-size="54" font-weight="700">Find out whether your idea</text>
    <text x="0" y="124" fill="#f7f8fb" font-family="DejaVu Sans, sans-serif" font-size="54" font-weight="700">deserves to live.</text>
    <text x="0" y="169" fill="#b5bfd1" font-family="DejaVu Sans, sans-serif" font-size="18">Get a blunt, evidence-driven verdict before you spend months building the wrong thing.</text>
  </g>

  <g transform="translate(100 355)">
    <rect width="770" height="446" rx="22" fill="url(#panel)" stroke="#30384b" stroke-width="2"/>
    <rect x="28" y="28" width="46" height="46" rx="12" fill="#281b49" stroke="#6d49bf"/>
    <text x="41" y="57" fill="#c4b5fd" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700">01</text>
    <text x="93" y="49" fill="#f7f8fb" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">Put an idea through the gate</text>
    <text x="93" y="76" fill="#9ca6b8" font-family="DejaVu Sans, sans-serif" font-size="14">Specific customers and painful problems get better results.</text>
    <text x="28" y="132" fill="#d8deea" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700">Describe the customer, the problem, and what you want to sell.</text>
    <rect x="28" y="149" width="714" height="177" rx="14" fill="#0b0e15" stroke="#3a455b"/>
    <text x="49" y="184" fill="#d6dce8" font-family="DejaVu Sans, sans-serif" font-size="16">Independent auto shops miss calls while technicians are busy. I want to sell them an AI</text>
    <text x="49" y="213" fill="#d6dce8" font-family="DejaVu Sans, sans-serif" font-size="16">receptionist that answers, qualifies the job, and books an appointment.</text>
    <text x="28" y="383" fill="#9ca6b8" font-family="DejaVu Sans, sans-serif" font-size="12">Minimum 10 characters</text>
    <rect x="521" y="350" width="221" height="62" rx="12" fill="url(#button)"/>
    <text x="568" y="389" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">Test this idea  →</text>
  </g>

  <g transform="translate(916 355)">
    <rect x="0" y="0" width="424" height="446" rx="22" fill="#11151f" stroke="#30384b" stroke-width="2"/>
    <rect x="27" y="28" width="46" height="46" rx="12" fill="#281b49" stroke="#6d49bf"/>
    <text x="40" y="57" fill="#c4b5fd" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700">02</text>
    <text x="91" y="49" fill="#f7f8fb" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">Idea pipeline</text>
    <text x="91" y="75" fill="#9ca6b8" font-family="DejaVu Sans, sans-serif" font-size="13">Reopen evidence and decisions.</text>
    <rect x="27" y="108" width="370" height="134" rx="14" fill="#171c28" stroke="#30384b"/>
    <text x="48" y="140" fill="#b9c6ff" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">V-73F00D5C</text>
    <rect x="252" y="122" width="123" height="26" rx="13" fill="#3b2d08" stroke="#7a621d"/>
    <text x="268" y="140" fill="#fde68a" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700">VALIDATING</text>
    <text x="48" y="181" fill="#d6dce8" font-family="DejaVu Sans, sans-serif" font-size="14">AI receptionist for auto shops…</text>
    <text x="48" y="215" fill="#9ca6b8" font-family="DejaVu Sans, sans-serif" font-size="11">Day 1</text>
    <rect x="27" y="261" width="370" height="134" rx="14" fill="#171c28" stroke="#30384b"/>
    <text x="48" y="293" fill="#b9c6ff" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">V-21A44BD9</text>
    <rect x="270" y="275" width="105" height="26" rx="13" fill="#401528" stroke="#8f3851"/>
    <text x="293" y="293" fill="#fda4af" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700">KILLED</text>
    <text x="48" y="334" fill="#d6dce8" font-family="DejaVu Sans, sans-serif" font-size="14">Generic AI meeting summarizer…</text>
    <text x="48" y="368" fill="#9ca6b8" font-family="DejaVu Sans, sans-serif" font-size="11">Day 3</text>
  </g>
